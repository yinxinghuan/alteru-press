<!DOCTYPE html>
<html lang="en">
<head>
<meta name="game-uuid" content="60803901-fa34-41ee-9b5d-ea40ed00c6ab" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Field Guide</title>
<meta name="theme-color" content="#0F0F0F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F5B1C7'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-family='Montserrat,sans-serif' font-weight='700' font-size='56' fill='%237700A1'%3EP%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #F5B1C7;
    --pink-strong: #E8709A;
    --purple: #7700A1;
    --ink: #0F0F0F;
    --ink-soft: #2A2A2A;
    --mute: #6B6B6B;
    --line: #D9D9D9;
    --paper: #F5F2EC;
    --paper-2: #FAF8F3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  /* ───────────────── Top nav (very thin) ───────────────── */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--paper);
    border-bottom: 1px solid var(--ink);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .navbar .back {
    color: var(--ink);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .navbar .back:active { color: var(--purple); }
  .navbar .brand {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: -0.01em;
    text-transform: none;
    color: var(--ink);
  }
  .navbar .brand .accent { color: var(--pink-strong); }
  .navbar .me { color: var(--mute); }

  /* ───────────────── Home screen (instant-use) ───────────────── */
  .home {
    padding: 24px 16px 40px;
  }

  .shoot {
    background: var(--ink);
    color: var(--paper);
    border-radius: 28px;
    padding: 56px 24px 28px;
    text-align: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .shoot:active { background: var(--ink-soft); }
  .shoot .iconring {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 3px solid var(--paper);
    background: transparent;
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .shoot .iconring::before {
    content: "";
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: var(--paper);
  }
  .shoot h1 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 28px;
    line-height: 1.2;
    margin-bottom: 10px;
    color: var(--paper);
  }
  .shoot .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--pink);
    margin-bottom: 22px;
  }
  .shoot .demo-strip {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .shoot .demo-strip a {
    color: var(--pink);
    border: 1px solid var(--pink);
    padding: 6px 10px;
    border-radius: 20px;
    text-decoration: none;
  }
  .shoot .demo-strip a:active { background: var(--pink); color: var(--ink); }
  .shoot input { display: none; }

  /* ───────────────── Wall (community) ───────────────── */
  .wall {
    padding: 40px 16px 32px;
  }
  .wall-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .wall-head h3 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.01em;
  }
  .wall-head .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--mute);
    text-transform: uppercase;
  }
  .wall-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .wall-card {
    background: var(--white, #fff);
    background: #FFFEF8;
    border: 1px solid var(--ink);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
  }
  .wall-card:active { background: var(--paper-2); }
  .wall-card .illus {
    width: 100%;
    aspect-ratio: 1;
    background: #F0EAD8;
    display: block;
  }
  .wall-card .body {
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .wall-card .title {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-style: italic;
    font-size: 15px;
    line-height: 1.2;
    color: var(--ink);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .wall-card .author {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--mute);
    cursor: pointer;
    min-width: 0;
  }
  .wall-card .author .avatar {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--paper-2);
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .wall-card .author .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .wall-card .author .avatar-letter {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 9px;
    color: var(--purple);
  }
  .wall-card .author--me {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .wall-card .author--me .name {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--pink-strong);
  }
  .wall-card .author[data-profile] { cursor: pointer; }
  .wall-card .author .name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .wall-card .author:active .name { color: var(--purple); }
  .wall-card .stats {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.08em;
    color: var(--mute);
    text-transform: uppercase;
  }
  .wall-empty {
    grid-column: 1 / -1;
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 32px 20px;
    text-align: center;
    color: var(--mute);
    font-style: italic;
    font-size: 14px;
  }

  /* ───────────────── Processing overlay ───────────────── */
  .processing-overlay {
    position: fixed;
    inset: 0;
    background: var(--ink);
    color: var(--paper);
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .processing-overlay.show { display: flex; }
  .processing-overlay .step {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--pink);
    margin-bottom: 14px;
    animation: blink 1.4s ease-in-out infinite;
  }
  .processing-overlay h2 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 28px;
    color: var(--paper);
    max-width: 320px;
  }
  @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

  /* ───────────────── Detail (overlay) ───────────────── */
  .detail-overlay {
    position: fixed;
    inset: 0;
    background: var(--paper);
    z-index: 300;
    overflow-y: auto;
    display: none;
  }
  .detail-overlay.show { display: block; }
  .detail-overlay .closebar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--paper);
    border-bottom: 1px solid var(--ink);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .detail-overlay .closebar button {
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .detail-overlay .closebar button:active { color: var(--purple); }

  .detail-overlay .poster-wrap {
    background: var(--paper-2);
    padding: 0;
  }

  /* ───── Native HTML dossier (mobile-readable) ───── */
  .dossier {
    background: var(--paper);
    padding: 0 0 28px;
  }
  .dossier .illus {
    display: block;
    width: 100%;
    height: auto;
    background: #F0EAD8;
    border-bottom: 1px solid var(--ink);
  }
  .dossier .body { padding: 22px 18px 0; }
  .dossier .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--purple);
    margin-bottom: 12px;
  }
  .dossier .title {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 40px;
    line-height: 1.0;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .dossier .subtitle {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 900;
    font-size: 30px;
    line-height: 1.0;
    letter-spacing: -0.02em;
    color: var(--pink-strong);
    margin-bottom: 26px;
  }

  .dossier section { padding-top: 22px; margin-top: 22px; border-top: 1px solid var(--ink); }
  .dossier section h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.18em;
    color: var(--purple);
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .dossier section h3 .count {
    font-weight: 400;
    color: var(--mute);
    letter-spacing: 0.14em;
  }
  .dossier .intro {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 18px;
    line-height: 1.45;
    color: var(--ink);
  }
  .dossier .anatomy { display: flex; flex-direction: column; gap: 14px; }
  .dossier .anatomy .part {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 14px;
    align-items: baseline;
  }
  .dossier .anatomy .part .name {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--ink);
  }
  .dossier .anatomy .part .note {
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--ink-soft);
  }
  .dossier .relatives { display: flex; flex-direction: column; gap: 16px; }
  .dossier .relatives .rel {
    border-bottom: 1px dashed var(--line);
    padding-bottom: 14px;
  }
  .dossier .relatives .rel:last-child { border-bottom: none; }
  .dossier .relatives .rel .rname {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-style: italic;
    font-size: 19px;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .dossier .relatives .rel .rorigin {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--mute);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .dossier .relatives .rel .rnote {
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--ink-soft);
  }
  .dossier .essay {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    line-height: 1.55;
    color: var(--ink-soft);
  }
  .dossier .filed {
    margin-top: 22px;
    padding-top: 14px;
    border-top: 3px double var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mute);
    text-align: center;
  }

  .detail-overlay .actions {
    position: sticky;
    bottom: 0;
    background: var(--paper);
    border-top: 1px solid var(--ink);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
  }
  .detail-overlay .actions button {
    flex: 1;
    min-height: 44px;
    background: var(--ink);
    color: var(--paper);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 8px;
  }
  .detail-overlay .actions button.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  .detail-overlay .actions button.pink {
    background: var(--pink-strong);
  }
  .detail-overlay .actions button:active { background: var(--purple); color: var(--paper); border-color: var(--purple); }

  .detail-overlay .author-bar {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .detail-overlay .author-bar .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--paper-2);
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    font-weight: 700;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    text-transform: uppercase;
    color: var(--purple);
  }
  .detail-overlay .author-bar .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .detail-overlay .author-bar [data-profile] { cursor: pointer; }
  .detail-overlay .author-bar [data-profile]:active { color: var(--purple); }
  .detail-overlay .author-bar .name {
    font-weight: 600;
    font-size: 14px;
  }
  .detail-overlay .author-bar .when {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--mute);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* ───────────────── Toast ───────────────── */
  .toast {
    position: fixed;
    bottom: 84px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    padding: 11px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 400;
    max-width: 90%;
    text-align: center;
    border-radius: 20px;
  }
  .toast.show { opacity: 1; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<nav class="navbar">
  <a class="back" href="../../" data-i18n="nav.back">← Press</a>
  <div class="brand">Field <span class="accent">Guide</span></div>
  <div class="me" id="userChip" data-i18n="nav.anon">anon</div>
</nav>

<main class="home">
  <section id="upload" class="shoot" tabindex="0">
    <input id="file" type="file" accept="image/*">
    <div class="iconring"></div>
    <h1 data-i18n="tool.cta.title">Identify any ordinary thing.</h1>
    <div class="hint" data-i18n="tool.cta.hint">Tap to take a photograph</div>
    <div class="demo-strip" id="demoBar"></div>
  </section>

  <section class="wall">
    <div class="wall-head">
      <h3 data-i18n="wall.heading">On the wall</h3>
      <div class="meta" id="wallCount" data-i18n="wall.recent">Recent</div>
    </div>
    <div id="wallGrid" class="wall-grid"></div>
  </section>
</main>

<div id="processing" class="processing-overlay">
  <div class="step" id="processingStep">READING</div>
  <h2 id="processingMsg">Reading the picture…</h2>
</div>

<div id="detail" class="detail-overlay">
  <div class="closebar">
    <button id="detailClose" data-i18n="detail.close">← Close</button>
    <span data-i18n="detail.brand">Field Guide</span>
    <span></span>
  </div>
  <div class="author-bar" id="detailAuthor"></div>
  <div class="poster-wrap" id="posterWrap"></div>
  <div class="actions">
    <button class="pink" id="publishBtn" data-i18n="detail.publish">Publish</button>
    <button id="dlPNG" data-i18n="detail.png">PNG</button>
    <button class="ghost" id="dlSVG" data-i18n="detail.svg">SVG</button>
    <button class="ghost hidden" id="shareFeedBtn" data-i18n="detail.share">Share</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="app.js"></script>

</body>
</html>
