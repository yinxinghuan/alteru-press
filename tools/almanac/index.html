<!DOCTYPE html>
<html lang="en">
<head>
<meta name="game-uuid" content="e9f7bd13-eb7a-488e-860e-67ad11bd78cd" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Almanac</title>
<meta name="theme-color" content="#0F0F0F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F5B1C7'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-family='Montserrat,sans-serif' font-weight='700' font-size='56' fill='%237700A1'%3EP%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* 黑历 palette — warm aged paper + 老黄历 deep red + ink */
    --paper: #F4ECD3;
    --paper-2: #FAF5DF;
    --paper-soft: #FCF7E2;
    --ink: #1A1410;
    --ink-soft: #4A3F30;
    --mute: #837860;
    --red: #B82018;
    --red-soft: #D4584B;
    --red-bg: rgba(184, 32, 24, 0.08);
    --gold: #B79460;
    --line: #C8B888;
    /* compat for shared brand.css */
    --pink: var(--red);
    --pink-strong: var(--red);
    --purple: var(--red);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  /* ───────────────── Top nav ───────────────── */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--paper);
    border-bottom: 1px solid var(--ink);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .navbar .back { color: var(--ink); text-decoration: none; }
  .navbar .back:active { color: var(--purple); }
  .navbar .brand {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 14px;
    text-transform: none;
  }
  .navbar .brand .accent { color: var(--pink-strong); }
  .navbar .me { color: var(--mute); }

  /* ───────────────── Loading ───────────────── */
  .loading {
    text-align: center;
    padding: 80px 24px;
  }
  .loading .pulse {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 24px;
    color: var(--mute);
    animation: pulse 1.3s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  /* ───────────────── Processing overlay (gen-image step) ───────────────── */
  .processing-overlay {
    position: fixed;
    inset: 0;
    background: var(--ink);
    color: var(--paper);
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .processing-overlay.show { display: flex; }
  .processing-overlay .step {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--pink);
    margin-bottom: 14px;
    animation: blink 1.4s ease-in-out infinite;
  }
  .processing-overlay h2 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 28px;
    color: var(--paper);
    max-width: 320px;
  }
  @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

  /* ───────────────── Black-calendar leaf (黑历) ───────────────── */
  .page-wrap { padding: 0; }
  .alm {
    background: var(--paper);
    padding: 0 16px 24px;
    position: relative;
  }

  /* Top stripe — month label + tiny meta */
  .alm .top-stripe {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 18px 0 12px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .alm .top-stripe .month-en {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-style: italic;
    font-size: 22px;
    letter-spacing: -0.01em;
    text-transform: none;
    color: var(--ink);
  }

  /* Hero — giant red date + lunar block beside */
  .alm .hero {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 24px;
    align-items: center;
    padding: 22px 0 18px;
  }
  .alm .hero .date-num {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 168px;
    line-height: 0.85;
    color: var(--red);
    letter-spacing: -0.08em;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.04);
    margin: 0;
  }
  .alm .hero .right {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  @media (max-width: 400px) {
    .alm .hero { gap: 18px; }
    .alm .hero .date-num { font-size: 140px; }
  }
  @media (max-width: 360px) {
    .alm .hero .date-num { font-size: 120px; }
  }
  .alm .hero .weekday {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-style: italic;
    font-size: 22px;
    color: var(--ink);
    line-height: 1.1;
  }
  .alm .hero .weekday-zh {
    font-size: 16px;
    color: var(--ink);
    font-weight: 600;
  }
  .alm .hero .lunar-line {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--ink-soft);
  }
  .alm .hero .ganzhi-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }
  .alm .hero .moon {
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .alm .hero .moon em { font-style: italic; color: var(--ink); text-transform: none; letter-spacing: 0; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 13px; }

  /* Sun/moon inline row */
  .alm .sun-moon-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 14px 0;
    margin-bottom: 18px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .alm .sun-moon-row .cell {
    text-align: center;
  }
  .alm .sun-moon-row .cell .k {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--mute);
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .alm .sun-moon-row .cell .v {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--ink);
  }

  /* 宜 / 忌 stacked rows */
  .alm .yj-row {
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .alm .yj-row .label {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 28px;
    line-height: 1;
    flex-shrink: 0;
    width: 48px;
  }
  .alm .yj-row .label.yi { color: var(--red); }
  .alm .yj-row .label.ji { color: var(--ink); }
  .alm .yj-row .label .en {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 8px;
    letter-spacing: 0.12em;
    color: var(--mute);
    margin-top: 4px;
    text-transform: uppercase;
  }
  .alm .yj-row .items {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .alm .yj-row .items .item {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--ink);
    line-height: 1.35;
  }
  .alm .yj-row .items .item .en {
    font-family: 'Montserrat', sans-serif;
    font-style: italic;
    font-size: 11px;
    color: var(--mute);
    margin-left: 6px;
    font-weight: 400;
  }

  /* Illustration — corner ornament aspect */
  .alm .illus {
    display: block;
    width: 100%;
    height: auto;
    margin: 20px 0;
    border: 1px solid var(--ink);
    box-shadow: 3px 3px 0 var(--red);
  }
  .alm .illus-fallback {
    aspect-ratio: 1;
    background: var(--paper-2);
    border: 1px dashed var(--gold);
    margin: 20px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: var(--mute);
    font-size: 14px;
  }

  /* History (历史上的今天) */
  .alm .otd-block {
    padding: 18px 0;
    border-top: 1px solid var(--line);
  }
  .alm .otd-block .h {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 20px;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .alm .otd-block .h em {
    display: inline-block;
    color: var(--red);
    font-style: normal;
  }
  .alm .otd-block .item {
    margin-bottom: 10px;
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--ink-soft);
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr);
    column-gap: 10px;
  }
  .alm .otd-block .item b {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--red);
    line-height: 1.55;
  }
  .alm .otd-block .item span.text {
    min-width: 0;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  /* Editor's note — red border card */
  .alm .note-card {
    margin-top: 18px;
    padding: 18px 22px;
    background: var(--red-bg);
    border-left: 4px solid var(--red);
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 17px;
    line-height: 1.5;
    color: var(--ink);
  }
  .alm .note-card::before {
    content: "“";
    display: block;
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-style: normal;
    font-size: 48px;
    line-height: 0.4;
    color: var(--red);
    margin-bottom: 8px;
  }

  /* Personal stamp on the page (when stamped) */
  .alm .stamp-mark {
    margin-top: 26px;
    padding: 18px 22px;
    border: 2px solid var(--red);
    border-radius: 4px;
    position: relative;
    background: var(--paper-soft);
    transform: rotate(-1.5deg);
  }
  .alm .stamp-mark .by {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--red);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .alm .stamp-mark .note {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--ink);
  }

  /* Filed footer */
  .alm .filed {
    margin-top: 28px;
    padding-top: 14px;
    border-top: 1px solid var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mute);
    text-align: center;
  }

  /* ───────────────── Stamp composer (signature feel) ───────────────── */
  .stamp-row {
    padding: 24px 16px 12px;
    background: var(--paper-soft);
    border-top: 1px solid var(--ink);
    border-bottom: 1px solid var(--ink);
  }
  .stamp-row h3 {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 16px;
    margin-bottom: 4px;
    color: var(--ink);
  }
  .stamp-row h3 em {
    color: var(--red);
    font-style: italic;
  }
  .stamp-row .stamp-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--mute);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .stamp-row textarea {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--ink);
    padding: 10px 0;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 18px;
    line-height: 1.4;
    color: var(--ink);
    resize: none;
    height: 70px;
    outline: none;
  }
  .stamp-row textarea::placeholder { color: var(--mute); }
  .stamp-row textarea:focus { border-bottom-color: var(--red); }
  .stamp-row .stamp-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .stamp-row .stamp-actions button {
    flex: 1;
    min-height: 44px;
    background: var(--red);
    color: var(--paper);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 2px;
    padding: 0 6px;
    white-space: nowrap;
  }
  .stamp-row .stamp-actions button:active { opacity: 0.7; }
  .stamp-row .share-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .stamp-row .share-row button {
    flex: 1;
    min-height: 38px;
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 2px;
  }
  .stamp-row .share-row button:active { color: var(--red); border-color: var(--red); }
  .stamp-row .small-hint {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--mute);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* ───────────────── Wall of stamps ───────────────── */
  .stamps {
    padding: 32px 16px 16px;
    margin-top: 4px;
  }
  .stamps h3 {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 22px;
    margin-bottom: 4px;
    color: var(--ink);
  }
  .stamps h3 em {
    color: var(--red);
    font-style: italic;
  }
  .stamps .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--mute);
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .stamp-card {
    background: var(--paper-soft);
    border: 1px solid var(--ink);
    border-left: 4px solid var(--red);
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .stamp-card .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .stamp-card .author {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--mute);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .stamp-card .author[data-profile] { cursor: pointer; }
  .stamp-card .author--me .name {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    color: var(--pink-strong);
  }
  .stamp-card .avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--paper-2);
    overflow: hidden;
    border: 1px solid var(--line);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .stamp-card .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .stamp-card .avatar-letter {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    color: var(--purple);
  }
  .stamp-card .author .name { color: var(--ink); font-weight: 600; }
  .stamp-card .when {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--mute);
    letter-spacing: 0.08em;
  }
  .stamp-card .note {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--ink);
    line-height: 1.4;
  }
  .stamps-empty {
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 28px 18px;
    text-align: center;
    color: var(--mute);
    font-style: italic;
    font-size: 14px;
  }

  /* ───────────────── Colophon ───────────────── */
  .colophon {
    margin-top: 32px;
    padding: 22px 16px 32px;
    border-top: 3px double var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--mute);
    text-transform: uppercase;
    line-height: 1.8;
  }

  /* ───────────────── Toast ───────────────── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    padding: 11px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 400;
    max-width: 90%;
    text-align: center;
    border-radius: 20px;
  }
  .toast.show { opacity: 1; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<nav class="navbar">
  <a class="back" href="../../" data-i18n="nav.back">← Press</a>
  <div class="brand">Almanac<span class="accent">.</span></div>
  <div class="me hidden" id="userChip"></div>
</nav>

<main>
  <div id="loading" class="loading">
    <div class="pulse" data-i18n="alm.loading">Reading today's page…</div>
  </div>

  <div id="page" class="page-wrap hidden"></div>

  <section id="stampRow" class="stamp-row hidden">
    <h3 data-i18n="stamp.heading">Stamp this page</h3>
    <textarea id="stampInput" data-i18n-attr="placeholder:stamp.placeholder" placeholder="one line · max 60 chars" maxlength="60"></textarea>
    <div class="stamp-actions">
      <button id="publishStamp" data-i18n="stamp.cta">Stamp</button>
    </div>
    <div class="share-row">
      <button id="dlPNG" class="ghost" data-i18n="detail.png">Save PNG</button>
      <button id="dlSVG" class="ghost" data-i18n="detail.svg">Save SVG</button>
    </div>
    <div class="small-hint" data-i18n="stamp.hint">your stamp goes on your copy + the wall below</div>
  </section>

  <section class="stamps">
    <h3 data-i18n="stamp.wallHeading">On the wall</h3>
    <div class="count" id="stampCount" data-i18n="stamp.wallToday">today</div>
    <div id="stampList"></div>
  </section>

  <footer class="colophon">
    © 2026 AlterU Press · Almanac<br>
    No. 0002 · Daily · Set in Playfair · Montserrat · JetBrains Mono
  </footer>
</main>

<div id="processing" class="processing-overlay">
  <div class="step" id="processingStep" data-i18n="alm.drawing.step">DRAWING</div>
  <h2 id="processingMsg" data-i18n="alm.drawing.msg">Drawing today's almanac…</h2>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="app.js?v=p4"></script>

</body>
</html>
