<!DOCTYPE html>
<html lang="en">
<head>
<meta name="game-uuid" content="" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Almanac</title>
<meta name="theme-color" content="#0F0F0F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F5B1C7'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-family='Montserrat,sans-serif' font-weight='700' font-size='56' fill='%237700A1'%3EP%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #F5B1C7;
    --pink-strong: #E8709A;
    --purple: #7700A1;
    --ink: #0F0F0F;
    --ink-soft: #2A2A2A;
    --mute: #6B6B6B;
    --line: #D9D9D9;
    --paper: #F5F2EC;
    --paper-2: #FAF8F3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  /* ───────────────── Top nav ───────────────── */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--paper);
    border-bottom: 1px solid var(--ink);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .navbar .back { color: var(--ink); text-decoration: none; }
  .navbar .back:active { color: var(--purple); }
  .navbar .brand {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 14px;
    text-transform: none;
  }
  .navbar .brand .accent { color: var(--pink-strong); }
  .navbar .me { color: var(--mute); }

  /* ───────────────── Loading ───────────────── */
  .loading {
    text-align: center;
    padding: 80px 24px;
  }
  .loading .pulse {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 24px;
    color: var(--mute);
    animation: pulse 1.3s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  /* ───────────────── Page view (the poster) ───────────────── */
  .page-wrap {
    padding: 16px 16px 0;
  }
  .page-wrap svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--paper);
    border: 1px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
  }

  /* ───────────────── Stamp composer ───────────────── */
  .stamp-row {
    padding: 24px 16px 8px;
  }
  .stamp-row h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--purple);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .stamp-row textarea {
    width: 100%;
    background: var(--paper-2);
    border: 1px solid var(--ink);
    padding: 12px 14px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 17px;
    line-height: 1.4;
    color: var(--ink);
    resize: none;
    height: 90px;
    outline: none;
  }
  .stamp-row textarea:focus { background: var(--white, #fff); border-color: var(--purple); }
  .stamp-row .stamp-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .stamp-row .stamp-actions button {
    flex: 1;
    min-height: 44px;
    background: var(--pink-strong);
    color: white;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 8px;
  }
  .stamp-row .stamp-actions button.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  .stamp-row .stamp-actions button:active { background: var(--purple); color: white; border-color: var(--purple); }
  .stamp-row .small-hint {
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--mute);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* ───────────────── Wall of stamps ───────────────── */
  .stamps {
    padding: 32px 16px 16px;
    border-top: 3px double var(--ink);
    margin-top: 32px;
  }
  .stamps h3 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 22px;
    margin-bottom: 12px;
  }
  .stamps .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--mute);
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .stamp-card {
    background: #FFFEF8;
    border: 1px solid var(--ink);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .stamp-card .author {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--mute);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .stamp-card .avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--pink);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
  }
  .stamp-card .author .name { color: var(--ink); font-weight: 600; }
  .stamp-card .author .when { margin-left: auto; }
  .stamp-card .note {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--ink);
    line-height: 1.4;
  }
  .stamps-empty {
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 28px 18px;
    text-align: center;
    color: var(--mute);
    font-style: italic;
    font-size: 14px;
  }

  /* ───────────────── Colophon ───────────────── */
  .colophon {
    margin-top: 32px;
    padding: 22px 16px 32px;
    border-top: 3px double var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--mute);
    text-transform: uppercase;
    line-height: 1.8;
  }

  /* ───────────────── Toast ───────────────── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    padding: 11px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 400;
    max-width: 90%;
    text-align: center;
    border-radius: 20px;
  }
  .toast.show { opacity: 1; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<nav class="navbar">
  <a class="back" href="../../" data-i18n="nav.back">← Press</a>
  <div class="brand">Almanac<span class="accent">.</span></div>
  <div class="me" id="userChip" data-i18n="nav.anon">anon</div>
</nav>

<main>
  <div id="loading" class="loading">
    <div class="pulse">Reading today's page…</div>
  </div>

  <div id="page" class="page-wrap hidden"></div>

  <section id="stampRow" class="stamp-row hidden">
    <h3>Stamp this page</h3>
    <textarea id="stampInput" placeholder="一句话 · or one line in your tongue · max 60 chars" maxlength="60"></textarea>
    <div class="stamp-actions">
      <button id="publishStamp">Stamp</button>
      <button id="dlPNG" class="ghost">PNG</button>
      <button id="dlSVG" class="ghost">SVG</button>
    </div>
    <div class="small-hint">your stamp goes on your copy + the wall below</div>
  </section>

  <section class="stamps">
    <h3>On the wall</h3>
    <div class="count" id="stampCount">today</div>
    <div id="stampList"></div>
  </section>

  <footer class="colophon">
    © 2026 AlterU Press · Almanac<br>
    No. 0002 · Daily · Set in Playfair · Montserrat · JetBrains Mono
  </footer>
</main>

<div id="toast" class="toast"></div>

<script type="module" src="app.js"></script>

</body>
</html>
